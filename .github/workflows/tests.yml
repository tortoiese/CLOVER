name: Python and Qt acceptance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      CLOVER_RAG_ENABLED: '0'
      CLOVER_RAG_PROVIDER: local
      CLOVER_RAG_ALLOW_NETWORK: '0'
      ANONYMIZED_TELEMETRY: 'False'
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: robot_factory_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: robot_factory_sim/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libegl1 libglib2.0-0
          libxkbcommon0 libdbus-1-3 libfreetype6 libfontconfig1 libxrender1 libxext6 libx11-6
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check new planning and evaluation modules
        run: >-
          python -m ruff check simulation/planning simulation/deadlock.py
          simulation/experiments.py simulation/experiment_replay.py simulation/wait_metrics.py
          simulation/scenario_suite.py simulation/scenario_benchmark.py gui/planning_settings.py
      - name: Run acceptance and Qt regression tests
        run: python -B -m pytest -q -p no:cacheprovider --junitxml=acceptance.xml
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-py${{ matrix.python }}
          path: robot_factory_sim/acceptance.xml
