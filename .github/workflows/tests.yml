name: Python and Qt acceptance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      CLOVER_RAG_ENABLED: '0'
      CLOVER_RAG_PROVIDER: local
      CLOVER_RAG_ALLOW_NETWORK: '0'
      ANONYMIZED_TELEMETRY: 'False'
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: robot_factory_sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: robot_factory_sim/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-legacy.txt pytest ruff
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libegl1 libglib2.0-0
          libxkbcommon0 libdbus-1-3 libfreetype6 libfontconfig1 libxrender1 libxext6 libx11-6
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check traffic contract and lifecycle code
        run: >-
          python -m ruff check --isolated --select E4,E7,E9,F,I
          simulation/resource_pool.py simulation/traffic_rules.py simulation/corridor.py
          simulation/path_graph.py simulation/robot.py simulation/engine.py simulation/state.py
          simulation/test_traffic_contract.py gui/widgets/traffic_item.py gui/main_window.py
          agent/rag/store.py agent/rag/service.py agent/rag_agent.py gui/agent_bridge.py conftest.py
          simulation/planning/live.py simulation/planning/test_live.py simulation/sim_worker.py
          gui/planning_settings.py gui/test_rh_gui.py gui/factory_panel.py gui/dashboard_panel.py
          gui/constants.py utils/event_types.py
      - name: Check planner runtime errors
        run: python -m ruff check --isolated --select E9,F63,F7,F82 simulation/planning simulation/decisions simulation/evaluation
      - name: Run acceptance and Qt regression tests
        run: python -B -m pytest -q -p no:cacheprovider --junitxml=acceptance.xml
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-py${{ matrix.python }}
          path: robot_factory_sim/acceptance.xml
