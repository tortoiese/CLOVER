name: Demo Recording

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      CLOVER_RAG_ENABLED: '1'
      CLOVER_RAG_PROVIDER: openai
      CLOVER_RAG_ALLOW_NETWORK: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANONYMIZED_TELEMETRY: 'False'
      MPLBACKEND: Agg
      DISPLAY: ':99'
    defaults:
      run:
        working-directory: robot_factory_sim

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: robot_factory_sim/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt -r requirements-legacy.txt
          pip install pyautogui python-xlib pillow

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libfreetype6 libfontconfig1 libxrender1 libxext6 libx11-6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb1 libxcb-util1 \
            xvfb ffmpeg x11-utils xdotool wmctrl \
            fonts-noto-cjk fonts-noto fonts-dejavu

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX &
          sleep 3
          echo "Xvfb ready"

      - name: Create intro clip
        run: python -B ../tools/make_intro.py

      - name: Run demo and record
        run: python -B ../tools/record_demo_linux.py

      - name: Concat intro + demo
        run: |
          ffmpeg -y \
            -i intro.mp4 -i demo_raw.mp4 \
            -filter_complex "[0:v][1:v]concat=n=2:v=1:a=0[v]" \
            -map "[v]" \
            -c:v libx264 -preset ultrafast -crf 18 -pix_fmt yuv420p \
            combined.mp4

      - name: Burn subtitles
        run: python -B ../tools/burn_subtitles.py combined.mp4 demo_subtitled.mp4

      - name: Show final video info
        run: ffprobe -v error -show_entries format=duration,size -of default combined.mp4 demo_subtitled.mp4 || true

      - name: Upload demo video (with subtitles)
        uses: actions/upload-artifact@v4
        with:
          name: clover-demo
          path: robot_factory_sim/demo_subtitled.mp4
          if-no-files-found: error

      - name: Upload raw (no subtitles, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-demo-raw
          path: robot_factory_sim/demo_raw.mp4
          if-no-files-found: warn
